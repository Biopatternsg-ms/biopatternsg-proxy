server {
    listen 80;
    server_name biopatternsg.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name biopatternsg.duckdns.org;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- DNS INTERNO DE DOCKER (EVITA QUE NGINX FALLE SI UN SERVICIO ESTÁ APAGADO) ---
    resolver 127.0.0.11 valid=30s;

    # UI principal
    location / {
        set $upstream_ui http://biopatternsg-ui:80;
        proxy_pass $upstream_ui;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # API Gateway (KrakenD)
    location /api/ {
        set $upstream_krakend http://krakend-gateway:9000;
        proxy_pass $upstream_krakend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Keycloak
    location /realms/ {
        set $upstream_keycloak http://keycloak-biopatternsg:8080;
        proxy_pass $upstream_keycloak;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /resources/ {
        set $upstream_keycloak http://keycloak-biopatternsg:8080;
        proxy_pass $upstream_keycloak;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /admin/ {
        set $upstream_keycloak http://keycloak-biopatternsg:8080;
        proxy_pass $upstream_keycloak;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
