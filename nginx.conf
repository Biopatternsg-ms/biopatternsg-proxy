# 1. Redirección permanente de HTTP (puerto 80) a HTTPS
server {
    listen 80;
    server_name biopatternsg.duckdns.org;

    return 301 https://$host$request_uri;
}

# 2. Servidor principal seguro HTTPS (puerto 443)
server {
    listen 443 ssl;
    server_name biopatternsg.duckdns.org;

    # --- CERTIFICADOS SSL DE LET'S ENCRYPT ---
    ssl_certificate /etc/letsencrypt/live/biopatternsg.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biopatternsg.duckdns.org/privkey.pem;

    # Protocolos seguros de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- BUFFER PARA KEYCLOAK (VITAL) ---
    # Evita el error "502 Bad Gateway" cuando Keycloak envía tokens JWT grandes con muchos roles
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- SITIO WEB PRINCIPAL (UI FRONTEND) ---
    location / {
        proxy_pass http://biopatternsg-ui:80;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Soporte para WebSockets (necesario si la UI usa hot-reload o sockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- API GATEWAY (KRAKEND) ---
    location /api/ {
        # CORRECCIÓN: 'krakend-gateway' (con 'd', tal como está en su docker-compose)
        proxy_pass http://krakend-gateway:9000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # --- KEYCLOAK: REALMS, RECURSOS Y ADMIN ---
    location /realms/ {
        proxy_pass http://keycloak-biopatternsg:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /resources/ {
        proxy_pass http://keycloak-biopatternsg:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /admin/ {
        proxy_pass http://keycloak-biopatternsg:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
